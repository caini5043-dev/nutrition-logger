// =============================================

let bird = {
  x: canvas.width * 0.25,
  y: canvas.height / 2,
  w: 44,
  h: 56,
  vy: 0,
  gravity: 0.32,
  jump: -8
};

let pipes = [];
const pipeW = 64;
const gap = 130;
let pipeSpeed = 3;
let spawnTimer = 0;
const spawnInterval = 130;

let score = 0;
let best = Number(localStorage.getItem("flappyBest")) || 0;
let gameOver = false;
let started = false;

function resetGame(){
  bird.y = canvas.height / 2;
  bird.vy = 0;
  pipes = [];
  score = 0;
  gameOver = false;
  started = false;
}

function jump(){
  if(gameOver){
    resetGame();
    return;
  }
  if(!started) started = true;
  bird.vy = bird.jump;
}

canvas.addEventListener("pointerdown", e=>{
  e.preventDefault();
  jump();
});
document.addEventListener("keydown", e=>{
  if(e.code === "Space") jump();
});

function spawnPipe(){
  const minTop = 60;
  const maxTop = canvas.height - gap - 60;
  const topH = minTop + Math.random() * (maxTop - minTop);
  pipes.push({
    x: canvas.width,
    topH: topH,
    scored: false
  });
}

function rectOverlap(a,b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update(){
  if(!started || gameOver) return;

  bird.vy += bird.gravity;
  bird.y += bird.vy;

  spawnTimer++;
  if(spawnTimer >= spawnInterval){
    spawnPipe();
    spawnTimer = 0;
  }

  for(let i = pipes.length -1; i >=0; i--){
    const p = pipes[i];
    p.x -= pipeSpeed;

    if(!p.scored && p.x + pipeW < bird.x){
      score++;
      p.scored = true;
    }
    if(p.x + pipeW < 0){
      pipes.splice(i,1);
    }

    const birdBox = {
      x: bird.x + 8,
      y: bird.y + 10,
      w: bird.w - 16,
      h: bird.h - 20
    };
    const pipeTop = {x:p.x, y:0, w:pipeW, h:p.topH};
    const pipeBot = {x:p.x, y:p.topH + gap, w:pipeW, h:canvas.height};
    if(rectOverlap(birdBox, pipeTop) || rectOverlap(birdBox, pipeBot)){
      gameOver = true;
      if(score > best){
        best = score;
        localStorage.setItem("flappyBest", best);
      }
    }
  }

  if(bird.y + bird.h > canvas.height || bird.y < 0){
    gameOver = true;
    if(score > best){
      best = score;
      localStorage.setItem("flappyBest", best);
    }
  }
}

function draw(){
  ctx.fillStyle = "#71c5cf";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#33aa33";
  for(const p of pipes){
    ctx.fillRect(p.x, 0, pipeW, p.topH);
    ctx.fillRect(p.x, p.topH + gap, pipeW, canvas.height);
    ctx.strokeStyle="#227722";
    ctx.lineWidth=3;
    ctx.strokeRect(p.x,0,pipeW,p.topH);
    ctx.strokeRect(p.x, p.topH+gap, pipeW, canvas.height);
  }

  const rot = Math.min(Math.max(bird.vy * 0.06, -0.4), 0.8);
  ctx.save();
  ctx.translate(bird.x + bird.w/2, bird.y + bird.h/2);
  ctx.rotate(rot);
  if(birdImg.complete && birdImg.naturalWidth){
    ctx.drawImage(birdImg, -bird.w/2, -bird.h/2, bird.w, bird.h);
  }else{
    ctx.fillStyle="#ffd700";
    ctx.beginPath();
    ctx.arc(0,0,24,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle="#fff";
  ctx.font="bold 32px system-ui";
  ctx.textAlign="center";
  ctx.fillText(score, canvas.width/2, 50);
  ctx.font="18px system-ui";
  ctx.fillText("最高分："+best, canvas.width/2, 80);

  if(!started && !gameOver){
    ctx.fillText("点击屏幕开始", canvas.width/2, canvas.height/2);
  }
  if(gameOver){
    ctx.fillText("游戏结束！点击重新开始", canvas.width/2, canvas.height/2);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
