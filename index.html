<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>营养记录器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{background:#f4f6f8;padding:20px;max-width:600px;margin:0 auto}
h1{text-align:center;margin-bottom:24px;color:#222;font-size:24px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #00000010}
input{width:100%;padding:12px 14px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:13px;border:none;border-radius:10px;background:#4080ff;color:#fff;font-size:17px;margin-top:8px}
button:active{background:#2b6ed9}
.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}
.del{color:#ff4d4f}
.total{font-weight:bold;font-size:18px;margin-top:12px;text-align:right}
</style>
</head>
<body>
<h1>营养记录器</h1>
<div class="card">
<input id="food" placeholder="食物名称">
<input id="cal" placeholder="热量（kcal）" type="number">
<input id="protein" placeholder="蛋白质（g）" type="number">
<button onclick="addItem()">添加记录</button>
</div>
<div class="card">
<div id="list"></div>
<div class="total">合计：热量 <span id="sumCal">0</span> kcal｜蛋白 <span id="sumPro">0</span> g</div>
<button style="background:#999;margin-top:16px" onclick="clearAll()">清空全部</button>
</div>
<script>
let data=JSON.parse(localStorage.getItem("foodList"))||[]
function render(){
    let html=""
    let sc=0,sp=0
    data.forEach((v,i)=>{
        html+=`<div class="item"><div>${v.name}｜${v.cal} kcal｜${v.pro} g</div><div class="del" onclick="del(${i})">删除</div></div>`
        sc+=Number(v.cal);sp+=Number(v.pro)
    })
    document.getElementById("list").innerHTML=html
    document.getElementById("sumCal").innerText=sc
    document.getElementById("sumPro").innerText=sp
    localStorage.setItem("foodList",JSON.stringify(data))
}
function addItem(){
    let name=document.getElementById("food").value.trim()
    let c=document.getElementById("cal").value
    let p=document.getElementById("protein").value
    if(!name||!c)return
    data.push({name,cal:c,pro:p})
    document.getElementById("food").value=""
    document.getElementById("cal").value=""
    document.getElementById("protein").value=""
    render()
}
function del(i){data.splice(i,1);render()}
function clearAll(){data=[];render()}
render()
</script>
</body>
</html>
